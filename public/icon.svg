  <path d="M96 256 H200 M312 256 H416 M256 96 V200 M256 312 V416" stroke="#27272a" stroke-width="6" stroke-dasharray="12 12" />
  <path d="M140 140 L220 220 M372 140 L292 220 M140 372 L220 292 M372 372 L292 292" stroke="#3f3f46" stroke-width="4" />
  
