  <circle cx="96" cy="256" r="22" fill="#10b981" />
  <circle cx="416" cy="256" r="22" fill="#06b6d4" />
  <circle cx="256" cy="96" r="22" fill="#f59e0b" />
  <circle cx="256" cy="416" r="22" fill="#10b981" />
  
  <!-- Little Inner Dots -->
