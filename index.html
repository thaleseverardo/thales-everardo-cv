    <!-- Limpeza automática de Service Worker / Cache em ambiente local de desenvolvimento -->
    <script>
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) { reg.unregister(); }
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) { caches.delete(name); }
          });
        }
      }
    </script>

    <!-- Anti-flicker: lê 'theme' do JSON único 'thales-everardo-cv' antes da renderização -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('thales-everardo-cv');
          var parsed = raw ? JSON.parse(raw) : null;
          var savedTheme = parsed && parsed.theme ? parsed.theme : null;
          var savedLang = parsed && parsed.language ? parsed.language : null;
          if (savedLang === 'PT' || (!savedLang && navigator.language && navigator.language.startsWith('pt'))) {
            document.documentElement.lang = 'pt-BR';
          } else if (savedLang === 'ES' || (!savedLang && navigator.language && navigator.language.startsWith('es'))) {
            document.documentElement.lang = 'es-ES';
          } else if (savedLang === 'FR' || (!savedLang && navigator.language && navigator.language.startsWith('fr'))) {
            document.documentElement.lang = 'fr-FR';
          } else {
            document.documentElement.lang = 'en-US';
          }
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = savedTheme || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
